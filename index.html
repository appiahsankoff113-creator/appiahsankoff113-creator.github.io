<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="refresh" content="2; url=https://nightlab.vercel.app" />
  <title>NIGHTLAB</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0b10;color:#f4f4f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 0%,#20142a 0,#0b0b10 42%)}
    main{width:min(680px,100%);text-align:center;padding:48px 24px;border:1px solid #2b2b38;border-radius:24px;background:rgba(20,20,28,.9)}
    .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d6a5c9;font-weight:800}
    h1{font-size:clamp(44px,10vw,82px);letter-spacing:-.05em;margin:12px 0 18px}
    p{color:#a2a2b3;line-height:1.65;margin:0 auto 24px;max-width:520px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,#f26bb2,#8b7cff);color:#fff;text-decoration:none;font-weight:800}
    small{display:block;color:#777788;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">18+ · private · no signup</div>
    <h1>NIGHTLAB</h1>
    <p>Redirecting to the current NIGHTLAB production experience.</p>
    <a href="https://nightlab.vercel.app">Open NIGHTLAB</a>
    <small>Entertainment only · 18+</small>
  </main>
  <script>setTimeout(function(){location.replace('https://nightlab.vercel.app')},1500)</script>
</body>
</html>
